# Nightcrier Configuration
# Copy this file to config.yaml and customize as needed.
#
# Configuration Precedence (highest to lowest):
# 1. Command-line flags (e.g., --mcp-endpoint)
# 2. Environment variables (e.g., K8S_CLUSTER_MCP_ENDPOINT)
# 3. This configuration file
#
# IMPORTANT: All fields marked as "Required" MUST be provided through one of these sources.
# There are no default values for required fields.
#
# Nightcrier searches for config.yaml in:
# - Current directory (.)
# - ./configs/
# - /etc/nightcrier/
# Or specify explicitly with: nightcrier --config /path/to/config.yaml

# =============================================================================
# Cluster Configuration (Required)
# =============================================================================
# REQUIRED: Array of clusters to monitor. Each cluster has its own MCP server
# endpoint and optional triage configuration.
clusters:
  - name: prod-us-east-1
    environment: production

    # MCP server connection settings
    mcp:
      endpoint: "http://kubernetes-mcp-server:8080/mcp"
      # API key placeholder for future MCP server authentication
      api_key: "THIS_IS_A_PLACEHOLDER_TO_REMIND_US_TO_MAKE_AUTH_WORK_ON_THE_MCP_SERVER"

    # Triage agent configuration
    triage:
      enabled: true
      # Path to read-only kubeconfig file for this cluster
      # During bootstrap, Nightcrier reads this file and creates a Secret
      # named "kubeconfig-{cluster-name}" containing the file contents.
      # Agents running in Jobs use this Secret to access the cluster.
      # This should be a LIMITED, READ-ONLY kubeconfig (not admin access).
      kubeconfig: "./kubeconfigs/prod-us-east-1-readonly.yaml"
      # Allow agent to read secrets/configmaps for Helm debugging
      # Default: false (disabled for security - secrets may contain credentials)
      # When enabled, agent can run helm_release_debug.sh and access Helm release data
      allow_secrets_access: false

# REQUIRED: Subscription mode for events_subscribe tool: "events" or "faults"
# - "faults": Only receive fault/warning events (recommended)
# - "events": Receive all Kubernetes events
# Environment variable: SUBSCRIBE_MODE
subscribe_mode: "faults"

# =============================================================================
# Workspace Configuration (Required)
# =============================================================================
# REQUIRED: Directory where incident workspaces are created
# Each incident gets a unique subdirectory with event context and results
# Environment variable: WORKSPACE_ROOT
workspace_root: "./incidents"

# =============================================================================
# Logging (Optional)
# =============================================================================
# Log level: debug, info, warn, error
# Default: info
# Environment variable: LOG_LEVEL
log_level: "info"

# =============================================================================
# Agent Configuration (Required)
# =============================================================================
# REQUIRED: Path to the agent execution script
# Environment variable: AGENT_SCRIPT_PATH
agent_script_path: "./agent-container/run-agent.sh"

# Optional: Path to the system prompt file for the agent
# Environment variable: AGENT_SYSTEM_PROMPT_FILE
agent_system_prompt_file: "./configs/base-triage-prompt.md"

# Optional: Comma-separated list of tools the agent is allowed to use
# Default: Read,Write,Grep,Glob,Bash,Skill
# Environment variable: AGENT_ALLOWED_TOOLS
agent_allowed_tools: "Read,Write,Grep,Glob,Bash,Skill"

# REQUIRED: AI model to use: sonnet, opus, haiku (Claude models)
# Environment variable: AGENT_MODEL
agent_model: "sonnet"

# REQUIRED: Maximum execution time for agent in seconds
# Environment variable: AGENT_TIMEOUT
agent_timeout: 300

# REQUIRED: AI CLI to use: claude, codex, goose, gemini
# Environment variable: AGENT_CLI
agent_cli: "claude"

# REQUIRED: Docker image for the agent container
# Environment variable: AGENT_IMAGE
agent_image: "nightcrier-agent:latest"

# Optional: Additional context for the agent (beyond the system prompt)
# Use this for cluster-specific information like SLOs, escalation contacts, or special constraints.
# The system prompt handles investigation methodology via the k8s-troubleshooter skill.
# Environment variable: ADDITIONAL_AGENT_PROMPT
# additional_agent_prompt: "SLO: 99.9% uptime. Escalation: page oncall@example.com for P1 issues."

# =============================================================================
# Skills Configuration (Optional)
# =============================================================================
# Directory where skills are cached (downloaded triage skills like k8s4agents)
# Default: ./agent-home/skills (relative to nightcrier working directory)
# Environment variable: SKILLS_CACHE_DIR
skills:
  cache_dir: "./agent-home/skills"
  # Optional: Disable triage script preloading (default: false)
  # When disabled, agent will run triage scripts itself
  # Environment variable: SKILLS_DISABLE_TRIAGE_PRELOAD
  disable_triage_preload: false

# =============================================================================
# LLM API Keys (At least one required)
# =============================================================================
# REQUIRED: At least one LLM API key must be provided.
# These can be set via environment variables OR this configuration file.
# Only set the key(s) for the LLM provider(s) you're using.
# WARNING: Be careful not to commit API keys to version control!
#
# BOOTSTRAP INTEGRATION:
# During startup, Nightcrier creates an "ai-api-keys" Secret in Kubernetes
# containing these API keys. This Secret is then mounted into agent Job containers.
# The Secret is only created if it doesn't already exist (idempotent).
#
# If you manually create the ai-api-keys Secret, Nightcrier will skip creation
# and use your existing Secret. At least one non-empty API key is required.
#
# Anthropic API key (for Claude)
# Environment variable: ANTHROPIC_API_KEY
# anthropic_api_key: "sk-ant-..."
#
# OpenAI API key (for Codex/GPT)
# Environment variable: OPENAI_API_KEY
# openai_api_key: "sk-..."
#
# Google/Gemini API key
# Environment variable: GEMINI_API_KEY
# gemini_api_key: "..."

# =============================================================================
# Kubernetes Configuration
# =============================================================================
# BOOTSTRAP BEHAVIOR:
# On startup, Nightcrier automatically provisions required Kubernetes resources
# if they don't already exist:
#   - Namespace (k8s_namespace)
#   - ServiceAccount, Role, RoleBinding (for agent execution)
#   - ai-api-keys Secret (from API keys below)
#   - kubeconfig-{cluster} Secrets (from triage.kubeconfig paths)
#
# Bootstrap operations are IDEMPOTENT - existing resources are never modified.
# If resources already exist (manually created or from previous runs), they are skipped.
#
# KUBECONFIG DISTINCTION:
# - kubeconfig_path: Admin kubeconfig for Nightcrier to connect and bootstrap resources
#   Requires elevated permissions (create namespaces, RBAC, Secrets)
#   Sourced from: KUBECONFIG env var > kubeconfig_path config > ~/.kube/config
#
# - triage.kubeconfig (per cluster): Read-only kubeconfig for AI agents
#   Used by agents running in Jobs to investigate incidents
#   Stored in kubeconfig-{cluster-name} Secrets for agent access
#   Should have limited, read-only permissions
#
# These are typically DIFFERENT files with different permission levels.
#
# Path to kubeconfig file for bootstrap connection
# Environment variable: KUBECONFIG_PATH
# kubeconfig_path: "~/.kube/config"

# Kubernetes context to use (default: current context)
# Environment variable: KUBERNETES_CONTEXT
# kubernetes_context: "my-cluster"

# =============================================================================
# K8s Executor Configuration (Kubernetes-native agent execution)
# =============================================================================
# Kubernetes namespace for Jobs and ConfigMaps
# Default: nightcrier
# Environment variable: K8S_NAMESPACE
k8s_namespace: "nightcrier"

# Container image for the agent runner
# Default: nc-agent-runner:latest
# Environment variable: K8S_IMAGE
k8s_image: "nc-agent-runner:latest"

# Image pull policy for the agent container
# Options: Always, Never, IfNotPresent
# - Always: Always pull the image from the registry
# - Never: Never pull, only use local images (for development with kind)
# - IfNotPresent: Pull if the image isn't already present locally (default)
# Default: IfNotPresent
# Environment variable: K8S_IMAGE_PULL_POLICY
k8s_image_pull_policy: "IfNotPresent"

# Job timeout in seconds
# Default: 600
# Environment variable: K8S_TIMEOUT
k8s_timeout: 600

# Memory limit for Job containers (e.g., "2Gi", "512Mi")
# Default: 2Gi
# Environment variable: K8S_MEMORY_LIMIT
k8s_memory_limit: "2Gi"

# CPU limit for Job containers (e.g., "1", "500m")
# Default: 1
# Environment variable: K8S_CPU_LIMIT
k8s_cpu_limit: "1"

# TTL for Job cleanup after completion (seconds)
# Default: 3600 (1 hour)
# Environment variable: K8S_CLEANUP_TTL
k8s_cleanup_ttl: 3600

# =============================================================================
# Event Processing (Required)
# =============================================================================
# REQUIRED: Minimum severity level to process: DEBUG, INFO, WARNING, ERROR, CRITICAL
# Events below this threshold are filtered out
# Environment variable: SEVERITY_THRESHOLD
severity_threshold: "ERROR"

# REQUIRED: Maximum number of concurrent agent sessions across all clusters
# Acts as a global circuit breaker to prevent resource exhaustion
# Environment variable: MAX_CONCURRENT_AGENTS
max_concurrent_agents: 5

# REQUIRED: Maximum size of the global event queue
# Environment variable: GLOBAL_QUEUE_SIZE
global_queue_size: 100

# REQUIRED: Maximum size of per-cluster event queues
# Each cluster gets its own queue to ensure fair processing
# Environment variable: CLUSTER_QUEUE_SIZE
cluster_queue_size: 10

# REQUIRED: Deduplication window in seconds (set to 0 to disable)
# Events for the same resource within this window are deduplicated
# Environment variable: DEDUP_WINDOW_SECONDS
dedup_window_seconds: 300

# REQUIRED: Queue overflow policy: drop (remove oldest) or reject (reject new events)
# Environment variable: QUEUE_OVERFLOW_POLICY
queue_overflow_policy: "drop"

# REQUIRED: Graceful shutdown timeout in seconds
# Environment variable: SHUTDOWN_TIMEOUT_SECONDS
shutdown_timeout: 30

# =============================================================================
# SSE/MCP Reconnection Settings (Required)
# =============================================================================
# REQUIRED: Initial backoff delay for reconnection attempts (seconds)
# Environment variable: SSE_RECONNECT_INITIAL_BACKOFF
sse_reconnect_initial_backoff: 1

# REQUIRED: Maximum backoff delay for reconnection attempts (seconds)
# Environment variable: SSE_RECONNECT_MAX_BACKOFF
sse_reconnect_max_backoff: 60

# REQUIRED: Read timeout for SSE/MCP connections (seconds)
# Environment variable: SSE_READ_TIMEOUT_SECONDS
sse_read_timeout: 120

# =============================================================================
# Slack Integration (Optional)
# =============================================================================
# Slack webhook URL for incident notifications
# If not set, Slack notifications are disabled
# Environment variable: SLACK_WEBHOOK_URL
# slack_webhook_url: "https://hooks.slack.com/services/..."

# =============================================================================
# Object Storage (Optional)
# =============================================================================
# When configured, incident artifacts are uploaded to cloud object storage
# and signed URLs are included in Slack notifications for direct access.
# Supports Azure Blob Storage, S3-compatible storage (AWS S3, MinIO, RustFS),
# and in-memory storage (for testing).
#
# object_storage:
#   # REQUIRED: Storage URL specifying provider and bucket/container
#   # Environment variable: OBJECT_STORAGE_URL
#   #
#   # Azure Blob Storage:
#   # url: "azblob://mycontainer"
#   #
#   # AWS S3:
#   # url: "s3://mybucket?region=us-east-1"
#   #
#   # S3-compatible (MinIO, RustFS):
#   # url: "s3://mybucket?endpoint=http://minio:9000&disable_https=true&use_path_style=true&region=us-east-1"
#   #
#   # In-memory (testing only):
#   # url: "mem://"
#
#   # Optional: Signed URL expiration duration (default: "168h" = 7 days)
#   # Environment variable: OBJECT_STORAGE_SIGNED_URL_EXPIRY
#   # signed_url_expiry: "168h"
#
#   # Azure credentials (required for azblob://)
#   # Environment variable: AZURE_STORAGE_ACCOUNT
#   # azure_storage_account: "mystorageaccount"
#   # Environment variable: AZURE_STORAGE_KEY
#   # azure_storage_key: "..."
#
#   # AWS/S3 credentials (required for s3://)
#   # Environment variable: AWS_ACCESS_KEY_ID
#   # aws_access_key_id: "..."
#   # Environment variable: AWS_SECRET_ACCESS_KEY
#   # aws_secret_access_key: "..."

# =============================================================================
# State Storage Configuration (Optional)
# =============================================================================
# Persistent storage backend for incident state tracking
# Type: "filesystem", "sqlite", or "postgres"
# Default: "filesystem" (backward compatible)
# Environment variable: STATE_STORAGE_TYPE
#
# SQLite (embedded database, recommended for single-node deployments):
state_storage:
  type: "sqlite"
  sqlite_path: "./data/nightcrier.db"
  migrations_path: "./migrations"

# PostgreSQL (for multi-node deployments requiring shared state):
# state_storage:
#   type: "postgres"
#   # Option 1: Use connection string
#   # postgres_connection_string: "postgres://user:password@localhost:5432/nightcrier?sslmode=disable"
#   #
#   # Option 2: Use individual fields
#   postgres_host: "localhost"
#   postgres_port: 5432
#   postgres_database: "nightcrier"
#   postgres_user: "postgres"
#   postgres_password: "your-password-here"
#   migrations_path: "./migrations"

# =============================================================================
# Circuit Breaker and Failure Notifications (Required/Optional)
# =============================================================================
# Optional: Whether to send notifications when agent failures occur
# When true, system degraded alerts are sent after threshold is reached
# Default: true
# Environment variable: NOTIFY_ON_AGENT_FAILURE
notify_on_agent_failure: true

# REQUIRED: Number of consecutive failures before triggering a system degraded alert
# Lower values = more sensitive, higher values = more tolerant
# Environment variable: FAILURE_THRESHOLD_FOR_ALERT
failure_threshold_for_alert: 3

# Optional: Whether to upload failed investigation attempts to storage
# When true, even failed investigations are saved to Azure/filesystem storage
# When false, only successful investigations are uploaded
# Default: false
# Environment variable: UPLOAD_FAILED_INVESTIGATIONS
upload_failed_investigations: false
