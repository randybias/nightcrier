# Nightcrier Configuration - Gemini Example
# Copy to config.yaml and set your GEMINI_API_KEY

# Single cluster configuration
clusters:
  - name: my-cluster
    environment: production

    mcp:
      endpoint: "http://kubernetes-mcp-server:8080/mcp"
      api_key: "PLACEHOLDER"

    triage:
      enabled: true
      kubeconfig: "./kubeconfigs/my-cluster-readonly.yaml"
      allow_secrets_access: false

# Event subscription mode
subscribe_mode: "faults"

# Workspace for incident investigations
workspace_root: "./incidents"

# Logging
log_level: "info"

# Agent configuration - Gemini with GEMINI.md context files
agent:
  # Gemini CLI configuration
  cli: "gemini"

  # Gemini model selection
  model: "gemini-3-flash-preview"  # Default: fast, cost-effective
  # model: "gemini-3-pro-preview"  # Alternative: higher capability

  # Agent execution settings
  timeout: 300
  system_prompt_file: "./configs/base-triage-prompt.md"
  allowed_tools: "Read,Write,Grep,Glob,Bash,Skill"

# LLM API Keys
# Set via environment variable: export GEMINI_API_KEY="..."
# gemini_api_key: "..."

# K8s Executor Configuration (Kubernetes-native agent execution)
k8s:
  namespace: "nightcrier"
  image: "nc-agent-runner:latest"
  image_pull_policy: "IfNotPresent"  # Options: Always, Never, IfNotPresent
  timeout: 600
  memory_limit: "2Gi"
  cpu_limit: "1"
  cleanup_ttl: 3600

# Event processing
severity_threshold: "ERROR"
max_concurrent_agents: 5
global_queue_size: 100
cluster_queue_size: 10
dedup_window_seconds: 300
queue_overflow_policy: "drop"
shutdown_timeout: 30

# SSE/MCP reconnection
sse_reconnect_initial_backoff: 1
sse_reconnect_max_backoff: 60
sse_read_timeout: 120

# State storage (sqlite, postgres, or filesystem)
state_storage:
  type: "sqlite"
  sqlite_path: "./data/nightcrier.db"
  migrations_path: "./migrations"

# Notifications
notify_on_agent_failure: true
failure_threshold_for_alert: 3
upload_failed_investigations: false

# Object Storage (optional)
# URL formats:
#   Azure:  azblob://container-name
#   AWS S3: s3://bucket-name?region=us-east-1
#   RustFS: s3://bucket-name?endpoint=http://localhost:8080&disable_https=true&use_path_style=true&awssdk=v2&region=us-east-1
#   Memory: mem:// (for testing only)
# object_storage:
#   url: "azblob://incident-reports"
#   signed_url_expiry: "168h"
#   azure_storage_account: "mystorageaccount"
#   azure_storage_key: "YOUR_AZURE_STORAGE_KEY_HERE"
