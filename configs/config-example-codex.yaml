# Nightcrier Configuration - Codex Example
# Copy to config.yaml and set your OPENAI_API_KEY

# Execution clusters (for Kubernetes-native agent execution)
execution_clusters: []

# Single cluster configuration
monitored_clusters:
  - name: my-cluster
    environment: production

    mcp:
      endpoint: "http://kubernetes-mcp-server:8080/mcp"
      # Optional: API key for Bearer token auth. Leave empty for unauthenticated access.
      # api_key: ""

    triage:
      enabled: true
      target_kubeconfig_path: "./kubeconfigs/my-cluster-readonly.yaml"
      allow_secrets_access: false

# Event subscription mode
subscribe_mode: "faults"

# Workspace for incident investigations
workspace_root: "./incidents"

# Logging
log_level: "info"

# Agent configuration - Codex with AGENTS.md
agent:
  # Codex CLI configuration
  cli: "codex"

  # Codex model selection (OpenAI models)
  model: "gpt-5.2"       # Default: gpt-5.2
  # model: "gpt-5.1"     # Alternative: previous generation
  # model: "gpt-4.1"     # Alternative: cost-effective

  # Agent execution settings
  timeout: 300
  system_prompt_file: "./configs/base-triage-prompt.md"
  allowed_tools: "Read,Write,Grep,Glob,Bash,Skill"

# LLM API Keys
# Set via environment variable: export OPENAI_API_KEY="sk-..."
# openai_api_key: "sk-..."

# Execution Defaults (Kubernetes-native agent execution)
execution_defaults:
  namespace: "nightcrier"
  runner_image: "nc-agent-runner:latest"
  image_pull_policy: "IfNotPresent"  # Options: Always, Never, IfNotPresent
  timeout: 600
  memory_limit: "2Gi"
  cpu_limit: "1"
  cleanup_ttl: 3600

# Event processing
severity_threshold: "ERROR"
max_concurrent_agents: 5
global_queue_size: 100
cluster_queue_size: 10
dedup_window_seconds: 300
queue_overflow_policy: "drop"
shutdown_timeout: 30

# MCP transport reconnection
mcp_reconnect_initial_backoff: 1
mcp_reconnect_max_backoff: 60
mcp_read_timeout: 120

# Startup configuration (resilient credential handling)
# Nightcrier starts in degraded mode if credentials are unavailable and retries in background
startup:
  credential_retry_initial: 5s    # Initial retry backoff
  credential_retry_max: 300s      # Max retry backoff (5 minutes)
  credential_retry_multiplier: 2.0

# State storage (sqlite, postgres, or filesystem)
state_storage:
  type: "sqlite"
  sqlite_path: "./data/nightcrier.db"
  migrations_path: "./migrations"

# Notifications
notify_on_agent_failure: true
failure_threshold_for_alert: 3
upload_failed_investigations: false

# Object Storage
# URL formats:
#   Azure:  azblob://container-name
#   AWS S3: s3://bucket-name?region=us-east-1
#   RustFS: s3://bucket-name?endpoint=http://localhost:8080&disable_https=true&use_path_style=true&awssdk=v2&region=us-east-1
#   Memory: mem:// (for testing only)
object_storage:
  url: "mem://"
#   url: "azblob://incident-reports"
  signed_url_expiry: "168h"
#   azure_storage_account: "mystorageaccount"
#   azure_storage_key: "YOUR_AZURE_STORAGE_KEY_HERE"
